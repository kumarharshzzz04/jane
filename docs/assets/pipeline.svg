<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Pipeline: your file, ingest and schema, the model, six guards, answer and receipt, with a retry loop back to the model">
  <title>How Jane answers a question</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 9 5 0 8.5z" fill="#7A827C"/>
    </marker>
    <marker id="arrow-poppy" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 9 5 0 8.5z" fill="#FF6B2C"/>
    </marker>
  </defs>

  <rect width="1000" height="300" fill="#0B0C0E"/>

  <!-- five stages of equal width, so the picture reads as one line of thought -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">

    <!-- 1 — the file -->
    <rect x="28" y="76" width="168" height="88" rx="12" fill="#15161A" stroke="#2A2C31"/>
    <text x="112" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#EDF4EE">your file</text>
    <text x="112" y="136" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="11.5" fill="#8C948E">CSV · Excel · JSON</text>

    <!-- 2 — ingest + schema -->
    <rect x="222" y="76" width="168" height="88" rx="12" fill="#15161A" stroke="#2A2C31"/>
    <text x="306" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#EDF4EE">ingest + schema</text>
    <text x="306" y="136" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="11.5" fill="#8C948E">header sniff · stats</text>

    <!-- 3 — the model -->
    <rect x="416" y="76" width="168" height="88" rx="12" fill="#15161A" stroke="#FF6B2C" stroke-width="1.5"/>
    <text x="500" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#EDF4EE">the model</text>
    <text x="500" y="136" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="11.5" fill="#8C948E">writes SQL or Python</text>

    <!-- 4 — the guards -->
    <rect x="610" y="76" width="168" height="88" rx="12" fill="#15161A" stroke="#58C08B" stroke-width="1.5"/>
    <text x="694" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#EDF4EE">six guards</text>
    <text x="694" y="136" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="11.5" fill="#8C948E">deterministic pandas</text>

    <!-- 5 — the answer -->
    <rect x="804" y="76" width="168" height="88" rx="12" fill="#15161A" stroke="#2A2C31"/>
    <text x="888" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#EDF4EE">answer + receipt</text>
    <text x="888" y="136" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="11.5" fill="#8C948E">rows · chart · proof</text>

    <!-- the line itself -->
    <g stroke="#7A827C" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M196 120 H216"/>
      <path d="M390 120 H410"/>
      <path d="M584 120 H604"/>
      <path d="M778 120 H798"/>
    </g>

    <!-- the retry loop: the guards send a bad answer back to the model -->
    <g stroke="#FF6B2C" stroke-width="1.6" fill="none" marker-end="url(#arrow-poppy)">
      <path d="M694 164 V214 H506 V170"/>
    </g>
    <text x="600" y="232" text-anchor="middle" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="12" fill="#FF8A45">retry · up to 5 tries</text>
  </g>

  <!-- what actually runs, which the boxes have no room to say -->
  <g font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="12.5" fill="#8C948E">
    <text x="500" y="264" text-anchor="middle">SQL runs in DuckDB, read-only · Python runs in an AST-whitelisted sandbox</text>
    <text x="500" y="286" text-anchor="middle">the schema goes in the prompt — no embeddings, no vector store</text>
  </g>
</svg>
